name: Database backup

on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    environment: backup
    timeout-minutes: 30
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check backup configuration
        id: backup_config
        run: |
          configured=true
          for name in BACKUP_DATABASE_URL R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET BACKUP_ENCRYPTION_KEY; do
            if [[ -z "${!name:-}" ]]; then
              configured=false
              break
            fi
          done
          echo "configured=$configured" >> "$GITHUB_OUTPUT"
          if [[ "$configured" != true ]]; then
            echo "::warning::External backup not configured — accepted beta risk"
          fi
      - name: Check tools
        if: steps.backup_config.outputs.configured == 'true'
        run: |
          command -v docker
          command -v gpg
          command -v aws
          command -v python3
      - name: Create, encrypt and verify offsite backup
        if: steps.backup_config.outputs.configured == 'true'
        run: bash scripts/database_backup.sh
