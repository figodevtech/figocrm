name: Backup health

on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-24.04
    environment: backup
    timeout-minutes: 10
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Check backup configuration
        id: backup_config
        run: |
          configured=true
          for name in BACKUP_DATABASE_URL R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET BACKUP_ENCRYPTION_KEY; do
            if [[ -z "${!name:-}" ]]; then
              configured=false
              break
            fi
          done
          echo "configured=$configured" >> "$GITHUB_OUTPUT"
          if [[ "$configured" != true ]]; then
            echo "::warning::External backup not configured — accepted beta risk"
          fi
      - name: Alert on missing or stale backup
        if: steps.backup_config.outputs.configured == 'true'
        run: python3 scripts/r2_backup_inventory.py health
